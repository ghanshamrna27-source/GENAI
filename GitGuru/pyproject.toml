[project]
name = "gitguru"
version = "1.0.0"
description = "Git & GitHub Learning Assistant API and Autonomous Agent"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "data/chroma_db",
    "scratch",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long (handled by formatter / intentional docstrings)
    "E402",  # Module level import not at top of file (sys.path manipulation in scripts)
    "F401",  # Unused imports (re-exported in __init__ files)
    "F841",  # Local variable assigned but never used
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
